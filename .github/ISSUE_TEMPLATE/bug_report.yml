name: Bug report
description: Report a reproducible relay problem using sanitized data.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Never include secrets in this report: no tenant tokens, no device tokens,
        no `.p8` keys, no grant-issuer keys and no grant strings.** Redact headers,
        payloads and database rows. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relay version or commit, deployment method (docker compose or other), host OS/architecture, and configuration shape (without values).
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: "`relay doctor` and `relay status` output"
      description: Paste sanitized output from `relay doctor` and `relay status`. Strip tokens, keys, grant strings and device identifiers before submitting.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized evidence
    validations:
      required: true
