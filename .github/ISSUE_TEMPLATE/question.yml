name: Support question
description: Support question for the APNs push relay
labels: [question, needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Explain the problem or use case and expected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and installation
      description: Include the relay version or commit and how it is deployed (docker compose or other).
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: What you have tried
      description: Describe the question, troubleshooting steps and relevant results (for example `relay doctor` and `relay status`). Redact tenant tokens, device tokens, `.p8` keys, grant strings, installation IDs and personal network details.
    validations:
      required: false
