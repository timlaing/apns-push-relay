name: Release Drafter
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: write
  # The autolabeler needs to read and write PR labels; it runs on
  # pull_request_target (metadata only — no PR code is checked out here).
  pull-requests: write
concurrency:
  group: release-drafter
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish: false
