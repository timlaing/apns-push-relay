name: debug-env
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Env dump
        run: env | grep -Ei 'color|tty|term|columns|ci=' || echo "NO MATCHING VARS"
      - name: Install
        run: uv sync --frozen
      - name: Capture behaviour
        run: |
          uv run python - <<'PYEOF'
          import io, os, contextlib
          from rich.console import Console
          c = Console()
          print("rich Console: is_terminal =", c.is_terminal, " color_system =", c.color_system)
          from apns_relay.cli.main import main
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              code = main([])
          print("main([]) exit:", code)
          print("capture[:300]:", repr(buf.getvalue()[:300]))
          PYEOF
