site_name: apns-push-relay
site_description: Generic, self-hostable APNs push relay — signed requests in, APNs out
site_url: https://timlaing.github.io/apns-push-relay/
repo_url: https://github.com/timlaing/apns-push-relay
repo_name: timlaing/apns-push-relay
edit_uri: edit/main/docs/

# Docs are served from GitHub Pages at the project's own github.io URL.
# When a custom `server.docs_domain` (PLAN §7) has real DNS, re-add
# docs/CNAME and point site_url at it to keep the two in sync.
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (Material auto-loads the runtime)
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true # tabbed content blocks (=== "Tab name")
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html # lets <div class="grid cards" markdown> on the homepage render
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Getting started: getting-started.md
  - Self-hosting: self-hosting.md
  - API:
      - OpenAPI: api/openapi.md
      - Enrollment spec (v1.2): api/enrollment-spec.md
  - Privacy: privacy.md
  - Limits & abuse: limits-and-abuse.md
  - Status: status.md

extra:
  social:
    - icon: material/github
      link: https://github.com/timlaing/apns-push-relay
