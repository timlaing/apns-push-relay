[project]
name = "apns-push-relay"
version = "0.3.0"
description = "Generic, self-hostable APNs push relay: signed requests in, APNs out"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tim Laing" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx[http2]>=0.27",
    "cryptography>=43",
    "pyyaml>=6",
    "cbor2>=5.6",
    "typer>=0.27.3",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
relay = "apns_relay.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=apns_relay --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["apns_relay"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # illustrative code blocks in the docs site are not lint/format targets

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # asserts are fine in tests and validation helpers
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer idiom: dependencies and options are declared as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
"scripts/*" = ["E402"]  # sys.path bootstrap before local imports
"clients/*" = ["S310"]  # reference client opens https URLs from config
"src/apns_relay/serve.py" = ["S104"]  # in-container listeners; compose publishes loopback-only

[tool.setuptools.package-data]
apns_relay = ["assets/*"]
